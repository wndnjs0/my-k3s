apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluentbit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.2
    helm:
      releaseName: fluentbit
      values: |
        envFrom:
          - secretRef:
              name: fluentbit-secret

        config:
          service: |
            [SERVICE]
                Daemon Off
                Flush {{ .Values.flush }}
                Log_Level {{ .Values.logLevel }}
                Parsers_File /fluent-bit/etc/parsers.conf
                Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
                HTTP_Server On
                HTTP_Listen 0.0.0.0
                HTTP_Port {{ .Values.metricsPort }}
                Health_Check On

          ## https://docs.fluentbit.io/manual/pipeline/inputs
          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*.log
                multiline.parser docker, cri
                Tag kube.*
                Exclude_Path /var/log/containers/fluentbit*.log
                Mem_Buf_Limit 5MB
                Skip_Long_Lines On

            [INPUT]
                Name systemd
                Tag host.*
                Systemd_Filter _SYSTEMD_UNIT=kubelet.service
                Read_From_Tail On

          ## https://docs.fluentbit.io/manual/pipeline/filters
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off
                K8S-Logging.Parser On
                K8S-Logging.Exclude On

          ## https://docs.fluentbit.io/manual/pipeline/outputs
          outputs: |
            [OUTPUT]
                Name   stdout
                Match  kube.*
                Format json_lines

            [OUTPUT]
                Name             http
                Match            kube.*
                Host             o2-openobserve-standalone.openobserve.svc.cluster.local
                Port             5080
                URI              /api/default/k3s/_json
                Format           json
                Json_date_key    _timestamp
                Json_date_format iso8601
                Header           Content-Type application/json
                Header           Authorization Basic ${O2_TOKEN}
                compress         gzip
                tls              Off
                Retry_Limit      5
                net.keepalive    On
  destination:
    server: https://kubernetes.default.svc
    namespace: fluentbit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true