---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keepout-env
  namespace: keepout
spec:
  encryptedData:
    KEEPOUT_ADMIN_EMAIL: 
    KEEPOUT_ADMIN_PASSWORD: 
    KEEPOUT_SESSION_SECRET: 
  template:
    metadata:
      name: keepout-env
      namespace: keepout
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gitea-registry
  namespace: keepout
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: gitea-registry
      namespace: keepout
    type: kubernetes.io/dockerconfigjson
