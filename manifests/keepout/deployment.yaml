apiVersion: apps/v1
kind: Deployment
metadata:
  name: keepout
  namespace: keepout
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keepout
  template:
    metadata:
      labels:
        app: keepout
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: keepout
          image: git.jmly.me/keepout/keepout:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: keepout-env
          env:
            - name: ORIGIN
              value: "https://keepout.jmly.me"
            - name: PORT
              value: "3000"
            - name: BODY_SIZE_LIMIT
              value: "Infinity"
            - name: KEEPOUT_MEDIA_DIR
              value: /data/media
            - name: KEEPOUT_TMP_DIR
              value: /data/tmp
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keepout-data