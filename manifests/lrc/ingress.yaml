apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lrc
  namespace: lrc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: lrc.jmly.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lrc
                port:
                  name: http