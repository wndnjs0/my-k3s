apiVersion: apps/v1
kind: Deployment
metadata:
  name: lrc
  namespace: lrc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lrc
  template:
    metadata:
      labels:
        app: lrc
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: lrc
          image: git.jmly.me/lrc/lrc:buildcache
          imagePullPolicy: Always
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lrc-secrets
                  key: admin_password
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lrc-data